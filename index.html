<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contest of Candy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-layout="topbar">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand" id="sidebar-brand">COC</div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <div class="app-shell">
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <a href="/" class="logo" id="logo-text" onclick="showPage(settings.pages[0]?.id || 'settings'); return false;">Contest of Candy</a>
        <nav class="top-nav" id="top-nav"></nav>
      </div>
    </header>

    <main id="main"></main>
  </div>

  <!-- Icon picker modal -->
  <div class="modal-overlay" id="icon-modal" onclick="closeIconModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h2>Pick an icon</h2>
        <button type="button" class="modal-close" onclick="closeIconModal()">&times;</button>
      </div>
      <input type="search" class="icon-search" id="icon-search" placeholder="Search icons..." oninput="filterIcons(this.value)" />
      <div class="icon-grid" id="icon-grid"></div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="script.js"></script>
</body>
</html>
